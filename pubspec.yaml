name: vm6_flow_reader
description: VM6 超声波流量计抄表应用（Flutter iOS 等价重写版，基于 A5 私有帧协议）。
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # BLE 通信（核心）
  flutter_reactive_ble: ^5.4.1
  # 本地 SQLite 存储（meters/readings/saved_devices/sync_queue 四表）
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  # 轻量配置持久化
  shared_preferences: ^2.3.0
  # 蓝牙/定位权限申请
  permission_handler: ^11.3.1
  # 抄表位置获取
  geolocator: ^12.0.0
  # UUID 生成（同步队列任务标识）
  uuid: ^4.4.0
  # 日期/数字格式化
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
