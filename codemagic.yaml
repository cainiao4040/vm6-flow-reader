workflows:
  ios-release:
    name: iOS Release (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..
      - name: Build release framework (no codesign)
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          cd Payload && zip -q -r ../vm6_flow_reader.ipa Runner.app && cd ..
          mv vm6_flow_reader.ipa build/ios/ipa/vm6_flow_reader.ipa
          echo "IPA: $(ls -lh build/ios/ipa/vm6_flow_reader.ipa)"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - recipient@example.com
